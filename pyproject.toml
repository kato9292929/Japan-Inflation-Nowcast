[project]
name = "japan-inflation-nowcast"
version = "0.0.0"
description = "Independent, daily, transparent, agent-readable inflation nowcast for Japan (food + housing). Not official CPI."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Japan Inflation Nowcast" }]

# 中核依存。指数計算・API・スクレイピング・設定。
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "pandas>=2.2",
    "numpy>=2.0",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "requests>=2.32",
    "pyarrow>=17",
    "lxml>=5.0",
]

[project.optional-dependencies]
# 必要時のみ。JS 描画サイト用。
browser = ["playwright>=1.48"]
postgres = ["psycopg[binary]>=3.2"]
# オンチェーン publish（運用者環境のみ。テストは web3 注入で実送信なし）。
oracle = ["web3>=7.0"]
# x402 exact/lnbtc ファシリテータ（別サービス・単一ホスト）。
# x402 本体の Python SDK は pypi 版を使い、未マージの mechanisms/lnbtc だけ vendoring する。
lnbtc = [
    "x402==2.24.0",
    "bolt11>=2.2.0",
    "bech32>=1.2.0",
    "coincurve>=21.0.0",
    "rfc8785>=0.1.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[project.scripts]
jin-daily = "jobs.daily:main"
jin-fetch-weights = "scrapers.estat.weights:main"
jin-import-csv = "jobs.import_csv:main"
jin-export-public = "jobs.export_public:main"
jin-refresh-inflation = "jobs.refresh_inflation:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "scrapers",
    "storage",
    "etl",
    "index_engine",
    "api",
    "jobs",
    "methodology",
    "dashboard",
    "oracle",
    "facilitator",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
# vendoring 領域は上流（x402 PR #1873）との差分を保つため整形・lint しない。
exclude = ["facilitator/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
